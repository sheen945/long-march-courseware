<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-label="战略转移：形势、筹划与执行"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8f4b38"/></marker></defs><rect width="1120" height="720" fill="#e9ddc4"/><path d="M38 109H1082" stroke="#9f7948"/><g font-family="Microsoft YaHei,SimSun,sans-serif"><text x="40" y="52" font-size="31" font-weight="700" fill="#4b3023">战略转移：形势、筹划与执行</text><text x="40" y="86" font-size="17" fill="#806747">1934年 · 分清五月开始筹划与十月实施</text><g><rect x="40" y="135" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="40" y="135" width="5" height="133" rx="2" fill="#84372e"/><text x="64" y="171" font-size="23" fill="#742c25" font-weight="600">01 形势变化</text><text x="64" y="206" font-size="20" fill="#42392d" font-weight="400">第五次反“围剿”陷入被动</text><text x="64" y="241" font-size="20" fill="#42392d" font-weight="400">敌军碉堡推进，中央苏区缩小</text></g><path d="M537 202H580" stroke="#8f4b38" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="594" y="135" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="594" y="135" width="5" height="133" rx="2" fill="#84372e"/><text x="618" y="171" font-size="23" fill="#742c25" font-weight="600">02 五月开始筹划</text><text x="618" y="206" font-size="20" fill="#42392d" font-weight="400">中央领导秘密研究战略转移</text><text x="618" y="241" font-size="20" fill="#42392d" font-weight="400">并非五月已经离开中央苏区</text></g><g><rect x="40" y="312" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="40" y="312" width="5" height="133" rx="2" fill="#84372e"/><text x="64" y="348" font-size="23" fill="#742c25" font-weight="600">03 政治安排</text><text x="64" y="383" font-size="20" fill="#42392d" font-weight="400">博古：政治方面的行动计划</text><text x="64" y="418" font-size="20" fill="#42392d" font-weight="400">组织、保密与有关安排</text></g><path d="M537 379H580" stroke="#8f4b38" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="594" y="312" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="594" y="312" width="5" height="133" rx="2" fill="#84372e"/><text x="618" y="348" font-size="23" fill="#742c25" font-weight="600">04 军事计划</text><text x="618" y="383" font-size="20" fill="#42392d" font-weight="400">李德：军事行动计划</text><text x="618" y="418" font-size="20" fill="#42392d" font-weight="400">周恩来：督促军事计划落实</text></g><g><rect x="40" y="489" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="40" y="489" width="5" height="133" rx="2" fill="#84372e"/><text x="64" y="525" font-size="23" fill="#742c25" font-weight="600">05 组织准备</text><text x="64" y="560" font-size="20" fill="#42392d" font-weight="400">部队编组、粮食、运输与保密</text><text x="64" y="595" font-size="20" fill="#42392d" font-weight="400">后方勤务与群众支援</text></g><path d="M537 556H580" stroke="#8f4b38" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="594" y="489" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="594" y="489" width="5" height="133" rx="2" fill="#84372e"/><text x="618" y="525" font-size="23" fill="#742c25" font-weight="600">06 十月实施</text><text x="618" y="560" font-size="20" fill="#42392d" font-weight="400">中央红军主力实行战略转移</text><text x="618" y="595" font-size="20" fill="#42392d" font-weight="400">于都集结、渡河，继续向西</text></g><text x="40" y="690" font-size="16" fill="#806747">教学示意 · 方框表示相关任务与时间节点，不表示地理距离；详见本章历史档案所列来源。</text></g></svg>