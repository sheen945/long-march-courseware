<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-label="夜渡于都河：组织与群众支援"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8f4b38"/></marker></defs><rect width="1120" height="720" fill="#e9ddc4"/><path d="M38 109H1082" stroke="#9f7948"/><g font-family="Microsoft YaHei,SimSun,sans-serif"><text x="40" y="52" font-size="31" font-weight="700" fill="#4b3023">夜渡于都河：组织与群众支援</text><text x="40" y="86" font-size="17" fill="#806747">1934年10月 · 多渡口、分批次、夜间行动</text><g><rect x="40" y="135" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="40" y="135" width="5" height="133" rx="2" fill="#84372e"/><text x="64" y="171" font-size="23" fill="#742c25" font-weight="600">01 指挥与集结</text><text x="64" y="206" font-size="20" fill="#42392d" font-weight="400">中共中央、中革军委组织转移</text><text x="64" y="241" font-size="20" fill="#42392d" font-weight="400">各军团及中央机关按计划集结</text></g><path d="M537 202H580" stroke="#8f4b38" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="594" y="135" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="594" y="135" width="5" height="133" rx="2" fill="#84372e"/><text x="618" y="171" font-size="23" fill="#742c25" font-weight="600">02 物资准备</text><text x="618" y="206" font-size="20" fill="#42392d" font-weight="400">群众筹集粮食与草鞋</text><text x="618" y="241" font-size="20" fill="#42392d" font-weight="400">个体故事与文物分别记录</text></g><g><rect x="40" y="312" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="40" y="312" width="5" height="133" rx="2" fill="#84372e"/><text x="64" y="348" font-size="23" fill="#742c25" font-weight="600">03 工程保障</text><text x="64" y="383" font-size="20" fill="#42392d" font-weight="400">工兵、船工和群众筹船架桥</text><text x="64" y="418" font-size="20" fill="#42392d" font-weight="400">门板、木料用于渡河设施</text></g><path d="M537 379H580" stroke="#8f4b38" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="594" y="312" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="594" y="312" width="5" height="133" rx="2" fill="#84372e"/><text x="618" y="348" font-size="23" fill="#742c25" font-weight="600">04 隐蔽转移</text><text x="618" y="383" font-size="20" fill="#42392d" font-weight="400">夜间渡河，白天隐蔽桥材</text><text x="618" y="418" font-size="20" fill="#42392d" font-weight="400">降低大规模转移暴露的风险</text></g><g><rect x="40" y="489" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="40" y="489" width="5" height="133" rx="2" fill="#84372e"/><text x="64" y="525" font-size="23" fill="#742c25" font-weight="600">05 个人档案</text><text x="64" y="560" font-size="20" fill="#42392d" font-weight="400">李声仁：船工　谢志坚：警卫员</text><text x="64" y="595" font-size="20" fill="#42392d" font-weight="400">黄春秀、曾大爷：支前群众</text></g><path d="M537 556H580" stroke="#8f4b38" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="594" y="489" width="486" height="133" rx="7" fill="#f5ecd6" stroke="#b79e71"/><rect x="594" y="489" width="5" height="133" rx="2" fill="#84372e"/><text x="618" y="525" font-size="23" fill="#742c25" font-weight="600">06 西进行动</text><text x="618" y="560" font-size="20" fill="#42392d" font-weight="400">通过于都河，开始突破封锁</text><text x="618" y="595" font-size="20" fill="#42392d" font-weight="400">后卫、运输与前卫各有任务</text></g><text x="40" y="690" font-size="16" fill="#806747">教学示意 · 方框表示相关任务与时间节点，不表示地理距离；详见本章历史档案所列来源。</text></g></svg>